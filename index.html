;letter-spacing:.6px;font-size:10px;color:#7c8596;font-weight:750;background:#f8fafc}td,th{padding:12px 11px;border-bottom:1px solid #edf0f5}td{font-size:12px}tbody tr:last-child td{border-bottom:0}.maincell{font-weight:700;color:#1c273b}.subcell{display:block;font-size:11px;color:var(--muted);margin-top:3px}.status{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:750;background:#f3f4f6;color:#4b5563}.status:before{content:"";height:5px;width:5px;border-radius:50%;background:currentColor}.status.green{background:#dcfce7;color:#166534}.status.blue{background:#dbeafe;color:#1d4ed8}.status.amber{background:#fef3c7;color:#92400e}.status.red{background:#fee2e2;color:#991b1b}.schedule-list{display:grid;gap:13px}.schedule-item{display:grid;grid-template-columns:54px 3px minmax(0,1fr);gap:12px;align-items:stretch}.time{font-size:12px;font-weight:750;padding-top:3px}.schedule-line{border-radius:5px;background:#bfdbfe}.schedule-body{padding:1px 0 8px}.schedule-body strong{font-size:12px;display:block}.schedule-body span{color:var(--muted);font-size:11px;display:block;margin-top:3px}.empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}.search{position:relative;min-width:220px;flex:1;max-width:390px}.search input{width:100%;padding:10px 12px 10px 35px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}.search span{position:absolute;left:12px;top:9px;color:#9ca3af}.filters{display:flex;gap:8px;align-items:center}.filters select,.field input,.field select,.field textarea{width:100%;border:1px solid #dce2ec;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.filters select{padding:9px 10px}.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{border-color:#93b4ff;box-shadow:0 0 0 3px #dbeafe}.field label{display:block;font-size:11px;font-weight:750;color:#536074;margin-bottom:6px}.field textarea{min-height:80px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#10182780;z-index:10;display:grid;place-items:center;padding:18px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 80px #0003}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:17px}.modal-body{padding:22px 23px}.close{border:0;background:#f3f4f6;border-radius:8px;height:32px;width:32px;font-size:18px}.toast{position:fixed;bottom:22px;right:22px;background:#172033;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);z-index:20;max-width:90vw}.doc-lines{display:grid;gap:9px}.doc-line{display:grid;grid-template-columns:minmax(0,1fr) 78px 115px 32px;gap:8px;align-items:center}.doc-line input{min-width:0;padding:9px;border:1px solid var(--line);border-radius:7px;width:100%}.doc-total{margin-left:auto;max-width:330px;margin-top:18px;display:grid;gap:9px}.total-row{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.total-row.grand{font-size:17px;color:var(--ink);font-weight:800;padding-top:10px;border-top:1px solid var(--line)}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.setting-card{padding:18px;border:1px solid var(--line);border-radius:12px}.setting-card h3{margin:0 0 5px;font-size:14px}.setting-card p{font-size:12px;color:var(--muted);margin:0 0 16px}.notice{background:#eff6ff;color:#1e40af;padding:12px 14px;border-radius:10px;font-size:12px;margin-top:16px}.notice.warn{background:#fff7ed;color:#9a3412}.customer-car{display:flex; <body><div class="app"><aside><div class="brand"><div class="brand-mark">⚙</div><div><strong>AtelierOS</strong><small>SERVICE MANAGEMENT</small></div></div><div><div class="nav-label">Spațiul de lucru</div><nav class="nav" id="sideNav"><button data-page="dashboard" class="active"><span class="ico">▦</span>Dashboard</button><button data-page="appointments"><span class="ico">▣</span>Programări</button><button data-page="workorders"><span class="ico">☷</span>Comenzi de lucru</button><button data-page="estimates"><span class="ico">▤</span>Devize</button><button data-page="invoices"><span class="ico">▧</span>Facturi</button></nav></div><div><div class="nav-label">Administrare</div><nav class="nav"><button data-page="customers"><span class="ico">♙</span>Clienți & mașini</button><button data-page="settings"><span class="ico">⚙</span>Setări service</button></nav></div><div class="side-bottom"><strong id="sideShop">Atelierul meu</strong><span>Versiune demo · date locale</span></div></aside><main class="main"><header class="topbar"><div><div class="crumb">AtelierOS / <span id="crumb">Dashboard</span></div><h1 id="pageTitle">Dashboard</h1></div><div class="top-right"><span class="pill">● Sistem local activ</span><div class="avatar">AS</div></div></header><div class="content" id="content"></div></main></div><nav class="mobile-nav" id="mobileNav"><button data-page="dashboard" class="active"><span>▦</span>Acasă</button><button data-page="appointments"><span>▣</span>Programări</button><button data-page="workorders"><span>☷</span>Comenzi</button><button data-page="estimates"><span>▤</span>Devize</button><button data-page="invoices"><span>▧</span>Facturi</button></nav><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const today=()=>new Date().toISOString().slice(0,10);const money=n=>new Intl.NumberFormat('ro-RO',{style:'currency',currency:'RON'}).format(Number(n)||0);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random().toString(36).slice(2,9).toUpperCase();const timeNow=()=>new Date().toTimeString().slice(0,5);let page='dashboard',searchText='',filterStatus='all';
const seed={settings:{shop:'Atelierul meu',cui:'',reg:'',address:'',phone:'',email:'',vat:21,vatRegistered:true,seriesEstimate:'DEV',seriesInvoice:'FACT',nextInvoice:1},customers:[{id:'C1001',name:'Andrei Popescu',phone:'0722 111 222',email:'andrei@example.ro',type:'Persoană fizică',notes:'',cars:[{id:'V1001',make:'Volkswagen',model:'Golf VII',plate:'B 100 ABC',vin:'',year:'2018',km:'142000'}]},{id:'C1002',name:'Maria Ionescu',phone:'0733 444 555',email:'maria@example.ro',type:'Persoană fizică',notes:'',cars:[{id:'V1002',make:'Dacia',model:'Duster',plate:'B 22 XYZ',vin:'',year:'2021',km:'68000'}]}],appointments:[{id:'P1001',date:today(),time:'09:00',customerId:'C1001',carId:'V1001',operation:'Revizie periodică',mechanic:'Mihai',status:'Confirmată',notes:''},{id:'P1002',date:today(),time:'11:30',customerId:'C1002',carId:'V1002',operation:'Diagnoză motor',mechanic:'Alex',status:'Programată',notes:''}],workorders:[{id:'CL-0001',date:today(),customerId:'C1001',carId:'V1001',km:'142000',complaint:'Revizie periodică și verificare frâne.',diagnosis:'',mechanic:'Mihai',status:'În lucru',lines:[{description:'Revizie — manoperă',qty:1,price:180},{description:'Ulei motor 5W-30',qty:5,price:45}],notes:''}],estimates:[],invoices:[]};let db;try{db=JSON.parse(localStorage.getItem('atelieros_db'))||structuredClone(seed)}catch(e){db=structuredClone(seed)}function save(){localStorage.setItem('atelieros_db',JSON.stringify(db))}function customer(id){return db.customers.find(x=>x.id===id)}function car(customerId,carId){return customer(customerId)?.cars.find(x=>x.id===carId)}function carName(cid,vid){let c=car(cid,vid);return c?[c.make,c.model].filter(Boolean).join(' ')+' · '+(c.plate||'fără nr.'):'Vehicul nespecificat'}function customerName(cid){return customer(cid)?.name||'Client șters'}function statusClass(s){if(/finalizat|achitat|acceptat|confirmat/i.test(s))return'green';if(/lucru|emis|programat/i.test(s))return'blue';if(/așteptare|restant|refuzat/i.test(s))return'amber';if(/anulat/i.test(s))return'red';return''}function tag(s){return `<span class="status ${statusClass(s)}">${esc(s)}</span>`}function totalLines(lines=[]){return lines.reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.price)||0),0)}function totals(net){let rate=db.settings.vatRegistered?Number(db.settings.vat)||0:0;return{net,vat:net*rate/100,gross:net*(1+rate/100),rate}}function pageLabel(p){return({dashboard:'Dashboard',appointments:'Programări',workorders:'Comenzi de lucru',estimates:'Devize',invoices:'Facturi',customers:'Clienți & mașini',settings:'Setări service'})[p]||p}function toast(msg){$('#toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}function empty(msg){return `<div class="empty">${msg}</div>`}function stat(icon,label,value,foot){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`}function head(title,sub,action,label){return `<div class="welcome"><div><h2>${title}</h2><p>${sub}</p></div>${action?`<div class="actions"><button class="btn primary" data-action="${action}">＋ ${label}</button></div>`:''}</div>`}function table(headers,rows,emptyText='Nu există înregistrări.'){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}">${empty(emptyText)}</td></tr>`}</tbody></table></div>`}function toolbar(placeholder,filterOptions=''){return `<div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" value="${esc(searchText)}" placeholder="${placeholder}"></div><div class="filters">${filterOptions?`<select id="statusFilter"><option value="all">Toate statusurile</option>${filterOptions}</select>`:''}<button class="btn sm" data-action="export">⇩ Export CSV</button></div></div>`}function render(){ $('#crumb').textContent=pageLabel(page);$('#pageTitle').textContent=pageLabel(page);$('#sideShop').textContent=db.settings.shop||'Atelierul meu';$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const c=$('#content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='appointments')c.innerHTML=appointmentsPage();if(page==='workorders')c.innerHTML=workordersPage();if(page==='estimates')c.innerHTML=estimatesPage();if(page==='invoices')c.innerHTML=invoicesPage();if(page==='customers')c.innerHTML=customersPage();if(page==='settings')c.innerHTML=settingsPage();let si=$('#searchInput');if(si)si.addEventListener('input',e=>{searchText=e.target.value;const pos=e.target.selectionStart;render();let n=$('#searchInput');n?.focus();n?.setSelectionRange(pos,pos)});let sf=$('#statusFilter');if(sf){sf.value=filterStatus;sf.addEventListener('change',e=>{filterStatus=e.target.value;render()})}}
function dashboard(){let ap=db.appointments.filter(a=>a.date===today()&&a.status!=='Anulată'),active=db.workorders.filter(w=>w.status!=='Finalizată'&&w.status!=='Anulată'),pending=db.estimates.filter(e=>e.status==='În așteptare'),unpaid=db.invoices.filter(i=>i.status!=='Achitată'&&i.status!=='Anulată'),rev=db.invoices.filter(i=>i.status==='Achitată').reduce((s,i)=>s+Number(i.gross||0),0);let rows=[...db.workorders].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(w=>`<tr><td><span class="maincell">${esc(w.id)}</span><span class="subcell">${esc(w.date)}</span></td><td><span class="maincell">${esc(customerName(w.customerId))}</span><span class="subcell">${esc(carName(w.customerId,w.carId))}</span></td><td>${tag(w.status)}</td><td>${money(totals(totalLines(w.lines)).gross)}</td></tr>`).join('');let schedule=ap.sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div class="schedule-item"><div class="time">${esc(a.time)}</div><div class="schedule-line"></div><div class="schedule-body"><strong>${esc(a.operation)}</strong><span>${esc(customerName(a.customerId))} · ${esc(carName(a.customerId,a.carId))}</span></div></div>`).join('');return `${head('Bun venit înapoi 👋','Iată o privire de ansamblu asupra service-ului tău.','appointment','Programare nouă')}<div class="stats">${stat('▣','Programări azi',ap.length,'Programări active pentru astăzi')}${stat('⚙','Comenzi active',active.length,'Mașini în lucru sau în așteptare')}${stat('▤','Devize în așteptare',pending.length,'Așteaptă aprobarea clientului')}${stat('↗','Facturi restante',money(unpaid.reduce((s,i)=>s+Number(i.gross||0),0)),`${unpaid.length} facturi neîncasate`)}</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h3>Comenzi de lucru recente</h3><p>Urmărește activitatea din atelier</p></div><button class="text-link" data-page="workorders">Vezi toate →</button></div>${table(['Comandă','Client / vehicul','Status','Valoare'],rows,'Nu ai comenzi de lucru. Creează prima comandă.')}</section><section class="panel"><div class="panel-head"><div><h3>Programările de azi</h3><p>${new Date().toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'})}</p></div><button class="text-link" data-page="appointments">Calendar →</button></div>${schedule?`<div class="schedule-list">${schedule}</div>`:empty('Nu ai programări active pentru astăzi.')}<div class="notice">💡 <strong>Încasări înregistrate:</strong> ${money(rev)}<br><span style="opacity:.8">Total facturi marcate ca achitate.</span></div></section></div><div class="notice warn">Demo local: datele sunt salvate în acest browser. Pentru utilizare comercială cu mai multe service-uri, va trebui conectat un backend securizat și implementată facturarea conformă.</div>`}
function appointmentsPage(){let arr=db.appointments.filter(a=>(filterStatus==='all'||a.status===filterStatus)&&[a.id,a.date,a.time,a.operation,a.mechanic,customerName(a.customerId),carName(a.customerId,a.carId)].join(' ').toLowerCase().includes(searchText.toLowerCase())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let rows=arr.map(a=>`<tr><td><span class="maincell">${esc(a.date)}</span><span class="subcell">${esc(a.time)}</span></td><td><span class="maincell">${esc(customerName(a.customerId))}</span><span class="subcell">${esc(customer(a.customerId)?.phone||'')}</span></td><td><span class="maincell">${esc(carName(a.customerId,a.carId))}</span><span class="subcell">${esc(a.operation)}</span></td><td>${esc(a.mechanic||'—')}</td><td>${tag(a.status)}</td><td><button class="btn sm" data-action="editAppointment" data-id="${a.id}">Editează</button> <button class="btn sm" data-action="toWork" data-id="${a.id}">Comandă ↗</button></td></tr>`).join('');return `${head('Programări','Planifică vizitele și organizează activitatea din atelier.','appointment','Adaugă programare')}${toolbar('Caută client, mașină sau operațiune...','<option>Programată</option><option>Confirmată</option><option>În lucru</option><option>Finalizată</option><option>Anulată</option>')}<section class="panel">${table(['Data / ora','Client','Vehicul / operațiune','Mecanic','Status','Acțiuni'],rows,'Nu există programări care să corespundă căutării.')}</section>`}
function workordersPage(){let arr=db.workorders.filter(w=>(filterStatus==='all'||w.status===filterStatus)&&[w.id,w.date,customerName(w.customerId),carName(w.customerId,w.carId),w.complaint,w.mechanic].join(' ').toLowerCase().includes(searchText.toLowerCase()));let rows=arr.map(w=>`<tr><td><span class="maincell">${esc(w.id)}</span><span class="subcell">${esc(w.date)}</span></td><td><span class="maincell">${esc(customerName(w.customerId))}</span><span class="subcell">${esc(carName(w.customerId,w.carId))}</span></td><td>${esc(w.complaint||'—')}</td><td>${esc(w.mechanic||'—')}</td><td>${tag(w.status)}</td><td>${money(totals(totalLines(w.lines)).gross)}</td><td><button class="btn sm" data-action="editWork" data-id="${w.id}">Deschide</button></td></tr>`).join('');return `${head('Comenzi de lucru','Documentează reclamația, diagnoza, operațiunile și piesele folosite.','work','Deschide comandă')}${toolbar('Caută număr, client, mașină...','<option>În așteptare</option><option>În lucru</option><option>Finalizată</option><option>Anulată</option>')}<section class="panel">${table(['Nr. comandă','Client / vehicul','Reclamație client','Mecanic','Status','Valoare estimată',''],rows,'Nu există comenzi de lucru.')}</section>`}
function estimatesPage(){let arr=db.estimates.filter(e=>(filterStatus==='all'||e.status===filterStatus)&&[e.id,e.date,customerName(e.customerId),carName(e.customerId,e.carId)].join(' ').toLowerCase().includes(searchText.toLowerCase()));let rows=arr.map(e=>`<tr><td><span class="maincell">${esc(e.id)}</span><span class="subcell">${esc(e.date)}</span></td><td><span class="maincell">${esc(customerName(e.customerId))}</span><span class="subcell">${esc(carName(e.customerId,e.carId))}</span></td><td>${esc(e.validUntil||'—')}</td><td>${tag(e.status)}</td><td>${money(e.gross)}</td><td><button class="btn sm" data-action="printEstimate" data-id="${e.id}">PDF / Tipărește</button> <button class="btn sm" data-action="acceptEstimate" data-id="${e.id}">Acceptă</button> <button class="btn sm" data-action="invoiceFromEstimate" data-id="${e.id}">Facturează</button></td></tr>`).join('');return `${head('Devize','Estimează costurile și obține aprobarea clientului înainte de reparație.','estimate','Deviz nou')}${toolbar('Caută deviz sau client...','<option>În așteptare</option><option>Acceptat</option><option>Refuzat</option><option>Expirat</option>')}<section class="panel">${table(['Număr deviz','Client / vehicul','Valabil până la','Status','Total','Acțiuni'],rows,'Nu există devize.')}</section>`}
function invoicesPage(){let arr=db.invoices.filter(i=>(filterStatus==='all'||i.status===filterStatus)&&[i.id,i.date,customerName(i.customerId),carName(i.customerId,i.carId)].join(' ').toLowerCase().includes(searchText.toLowerCase()));let rows=arr.map(i=>`<tr><td><span class="maincell">${esc(i.id)}</span><span class="subcell">${esc(i.date)}</span></td><td><span class="maincell">${esc(customerName(i.customerId))}</span><span class="subcell">${esc(carName(i.customerId,i.carId))}</span></td><td>${esc(i.dueDate||'—')}</td><td>${tag(i.status)}</td><td>${money(i.gross)}</td><td><button class="btn sm" data-action="printInvoice" data-id="${i.id}">PDF / Tipărește</button> <button class="btn sm" data-action="togglePaid" data-id="${i.id}">${i.status==='Achitată'?'Marchează restantă':'Marchează achitată'}</button></td></tr>`).join('');return `${head('Facturi','Gestionează facturile și urmărește încasările.','invoice','Factură nouă')}${toolbar('Caută factură sau client...','<option>Emisă</option><option>Achitată</option><option>Restantă</option><option>Anulată</option>')}<section class="panel">${table(['Număr factură','Client / vehicul','Scadență','Status','Total','Acțiuni'],rows,'Nu există facturi.')}</section><div class="notice warn">Facturile generate aici sunt documente demonstrative pentru tipărire. Pentru emitere fiscală reală și RO e-Factura este necesară validarea fluxului fiscal și integrarea corespunzătoare.</div>`}
function customersPage(){let arr=db.customers.filter(c=>[c.name,c.phone,c.email,...c.cars.flatMap(v=>[v.make,v.model,v.plate,v.vin])].join(' ').toLowerCase().includes(searchText.toLowerCase()));let rows=arr.map(c=>`<tr><td><span class="maincell">${esc(c.name)}</span><span class="subcell">${esc(c.phone||'Telefon nespecificat')} · ${esc(c.email||'')}</span></td><td>${c.cars.map(v=>`<div class="customer-car"><span class="car-icon">🚘</span><span><span class="maincell">${esc(v.make)} ${esc(v.model)}</span><span class="subcell">${esc(v.plate)} · ${esc(v.km||'—')} km</span></span></div>`).join('<hr style="border:0;border-top:1px solid #eee">')||'—'}</td><td>${esc(c.type||'Persoană fizică')}</td><td><button class="btn sm" data-action="editCustomer" data-id="${c.id}">Editează</button> <button class="btn sm" data-action="addCar" data-id="${c.id}">＋ Mașină</button></td></tr>`).join('');return `${head('Clienți & mașini','Bază de date pentru clienți și vehiculele lor.','customer','Client nou')}${toolbar('Caută nume, telefon, număr auto...')}<section class="panel">${table(['Client / contact','Vehicule','Tip client','Acțiuni'],rows,'Nu există clienți.')}</section>`}
function settingsPage(){let s=db.settings;return `${head('Setări service','Configurează identitatea atelierului și regulile de calcul.') }<div class="settings-grid"><section class="setting-card"><h3>🏢 Datele service-ului</h3><p>Aceste informații apar pe documentele tipărite.</p><form id="settingsForm"><div class="field"><label>Denumire service</label><input name="shop" value="${esc(s.shop)}" required></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>CUI</label><input name="cui" value="${esc(s.cui)}" placeholder="RO12345678"></div><div class="field"><label>Nr. Registrul Comerțului</label><input name="reg" value="${esc(s.reg)}"></div><div class="field full"><label>Adresă</label><input name="address" value="${esc(s.address)}"></div><div class="field"><label>Telefon</label><input name="phone" value="${esc(s.phone)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(s.email)}"></div></div><button class="btn primary" style="margin-top:16px" type="submit">Salvează datele</button></form></section><section class="setting-card"><h3>🧾 Taxe și numerotare</h3><p>Setări de calcul demonstrative; verifică regimul fiscal aplicabil.</p><form id="taxForm"><div class="field"><label>Înregistrat în scopuri de TVA?</label><select name="vatRegistered"><option value="true" ${s.vatRegistered?'selected':''}>Da</option><option value="false" ${!s.vatRegistered?'selected':''}>Nu</option></select></div><div class="field" style="margin-top:12px"><label>Cota TVA (%)</label><input type="number" min="0" max="100" step="0.01" name="vat" value="${Number(s.vat)}"></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Prefix devize</label><input name="seriesEstimate" value="${esc(s.seriesEstimate)}"></div><div class="field"><label>Prefix facturi</label><input name="seriesInvoice" value="${esc(s.seriesInvoice)}"></div></div><button class="btn primary" style="margin-top:16px" type="submit">Salvează setările</button></form><div class="notice warn">Cota implicită este configurabilă și nu garantează conformitatea fiscală. Confirmă cota și obligațiile actuale cu contabilul înainte de emitere.</div></section><section class="setting-card"><h3>💾 Date și copii de siguranță</h3><p>Datele se păstrează în localStorage în acest browser. Exportă periodic o copie.</p><div class="actions"><button class="btn" data-action="backup">⇩ Descarcă backup JSON</button><button class="btn" data-action="restore">⇧ Importă backup JSON</button><input id="backupFile" type="file" accept="application/json" class="hidden"></div><div class="notice">Pentru versiunea SaaS va trebui autentificare, bază de date online, permisiuni per service și backup automat.</div></section><section class="setting-card"><h3>🧪 Date demonstrative</h3><p>Poți reseta aplicația la setul inițial de date.</p><button class="btn danger" data-action="reset">Resetează datele demo</button></section></div>`}
function customerOptions(selected=''){return db.customers.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}${c.phone?' · '+esc(c.phone):''}</option>`).join('')}function carOptions(cid,selected=''){return (customer(cid)?.cars||[]).map(v=>`<option value="${v.id}" ${v.id===selected?'selected':''}>${esc(v.make)} ${esc(v.model)} · ${esc(v.plate)}</option>`).join('')}function openModal(title,body){$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" data-action="closeModal">×</button></div><div class="modal-body">${body}</div></div></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeModal()})}function closeModal(){$('#modalRoot').innerHTML=''}function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,options,selected=''){return `<div class="field"><label>${label}</label><select name="${name}" required>${options.map(o=>`<option value="${esc(o[0])}" ${o[0]===selected?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`}function formModal(title,fields,onSave,submit='Salvează'){openModal(title,`<form id="modalForm">${fields}<div class="form-actions"><button type="button" class="btn" data-action="closeModal">Anulează</button><button class="btn primary" type="submit">${submit}</button></div></form>`);$('#modalForm').addEventListener('submit',e=>{e.preventDefault();onSave(Object.fromEntries(new FormData(e.target).entries()))})}
function appointmentForm(a={}){let cid=a.customerId||db.customers[0]?.id||'';formModal(a.id?'Editează programarea':'Programare nouă',`<div class="form-grid">${selectField('Client','customerId',db.customers.map(c=>[c.id,c.name]),cid)}<div class="field"><label>Vehicul</label><select name="carId">${carOptions(cid,a.carId)}</select></div>${field('Data','date',a.date||today(),'date')}${field('Ora','time',a.time||timeNow(),'time')}${field('Operațiune de efectuat','operation',a.operation||'','text','required')}${field('Mecanic responsabil','mechanic',a.mechanic||'')}${selectField('Status','status',['Programată','Confirmată','În lucru','Finalizată','Anulată'].map(x=>[x,x]),a.status||'Programată')}<div class="field full"><label>Observații</label><textarea name="notes">${esc(a.notes||'')}</textarea></div></div>`,d=>{if(a.id)Object.assign(a,d);else db.appointments.push({id:'PR-'+id(),...d});save();closeModal();render();toast('Programarea a fost salvată.')})}
function customerForm(c={}){formModal(c.id?'Editează client':'Client nou',`<div class="form-grid">${field('Nume / denumire','name',c.name||'','text','required')}${field('Telefon','phone',c.phone||'','tel')}${field('Email','email',c.email||'','email')}${selectField('Tip client','type',[['Persoană fizică','Persoană fizică'],['Persoană juridică','Persoană juridică']],c.type||'Persoană fizică')}<div class="field full"><label>Observații</label><textarea name="notes">${esc(c.notes||'')}</textarea></div></div>`,d=>{if(c.id)Object.assign(c,d);else db.customers.push({id:'C-'+id(),...d,cars:[]});save();closeModal();render();toast('Client salvat.')})}
function carForm(cid,v={}){formModal(v.id?'Editează vehicul':'Adaugă vehicul',`<div class="form-grid">${field('Marcă','make',v.make||'','text','required')}${field('Model','model',v.model||'','text','required')}${field('Număr înmatriculare','plate',v.plate||'')}${field('An fabricație','year',v.year||'','number')}${field('VIN / serie șasiu','vin',v.vin||'')}${field('Kilometraj','km',v.km||'','number')}</div>`,d=>{let c=customer(cid);if(!c)return;if(v.id)Object.assign(v,d);else c.cars.push({id:'V-'+id(),...d});save();closeModal();render();toast('Vehicul salvat.')})}
function linesEditor(lines){return `<div class="field full"><label>Piese și manoperă</label><div class="doc-lines" id="docLines">${lines.map((l,i)=>lineHTML(l,i)).join('')}</div><button type="button" class="btn sm" style="margin-top:9px" data-action="addLine">＋ Adaugă poziție</button></div>`}function lineHTML(l,i){return `<div class="doc-line"><input name="desc" aria-label="Descriere" placeholder="Piesă / operațiune" value="${esc(l.description)}" required><input name="qty" aria-label="Cantitate" type="number" min="0.01" step="0.01" value="${Number(l.qty)||1}" required><input name="price" aria-label="Preț unitar" type="number" min="0" step="0.01" value="${Number(l.price)||0}" required><button class="btn sm danger" type="button" data-action="removeLine">×</button></div>`}function getLines(){return $$('#docLines .doc-line').map(el=>({description:el.querySelector('[name=desc]').value,qty:Number(el.querySelector('[name=qty]').value)||0,price:Number(el.querySelector('[name=price]').value)||0}))}function updateDocTotal(){let lines=getLines(),t=totals(totalLines(lines)),box=$('#docTotal');if(box)box.innerHTML=`<div class="total-row"><span>Subtotal</span><strong>${money(t.net)}</strong></div><div class="total-row"><span>TVA (${t.rate}%)</span><strong>${money(t.vat)}</strong></div><div class="total-row grand"><span>Total</span><strong>${money(t.gross)}</strong></div>`}
function workForm(w={}){let cid=w.customerId||db.customers[0]?.id||'',lines=w.lines?.length?w.lines:[{description:'Manoperă',qty:1,price:0}];formModal(w.id?'Editează comanda '+w.id:'Comandă de lucru nouă',`<div class="form-grid">${selectField('Client','customerId',db.customers.map(c=>[c.id,c.name]),cid)}<div class="field"><label>Vehicul</label><select name="carId">${carOptions(cid,w.carId)}</select></div>${field('Data intrării','date',w.date||today(),'date')}${field('Kilometraj la intrare','km',w.km||'','number')}${field('Mecanic','mechanic',w.mechanic||'')}${selectField('Status','status',['În așteptare','În lucru','Finalizată','Anulată'].map(x=>[x,x]),w.status||'În așteptare')}<div class="field full"><label>Reclamația clientului</label><textarea name="complaint" required>${esc(w.complaint||'')}</textarea></div><div class="field full"><label>Diagnoză / lucrări efectuate</label><textarea name="diagnosis">${esc(w.diagnosis||'')}</textarea></div>${linesEditor(lines)}<div class="field full"><label>Observații</label><textarea name="notes">${esc(w.notes||'')}</textarea></div></div><div class="doc-total" id="docTotal"></div>`,d=>{let all={...d,lines:getLines()};if(w.id)Object.assign(w,all);else db.workorders.push({id:'CL-'+String(db.workorders.length+1).padStart(4,'0'),...all});save();closeModal();render();toast('Comanda de lucru a fost salvată.')},'Salvează comanda');$$('#modalForm [name=customerId]').forEach(el=>el.addEventListener('change',()=>{let select=$('#modalForm [name=carId]');select.innerHTML=carOptions(el.value);}));$('#docLines').addEventListener('input',updateDocTotal);updateDocTotal()}
function estimateForm(e={}){let cid=e.customerId||db.customers[0]?.id||'',source=e.lines?.length?e.lines:[{description:'Manoperă',qty:1,price:0}];formModal(e.id?'Editează deviz':'Deviz nou',`<div class="form-grid">${selectField('Client','customerId',db.customers.map(c=>[c.id,c.name]),cid)}<div class="field"><label>Vehicul</label><select name="carId">${carOptions(cid,e.carId)}</select></div>${field('Data','date',e.date||today(),'date')}${field('Valabil până la','validUntil',e.validUntil||today(),'date')}${selectField('Status','status',['În așteptare','Acceptat','Refuzat','Expirat'].map(x=>[x,x]),e.status||'În așteptare')}${field('Referință / comandă','workorderId',e.workorderId||'')}<div class="field full"><label>Note pentru client</label><textarea name="notes">${esc(e.notes||'')}</textarea></div>${linesEditor(source)}</div><div class="doc-total" id="docTotal"></div>`,d=>{let t=totals(totalLines(getLines())),obj={...d,lines:getLines(),net:t.net,vat:t.vat,gross:t.gross,vatRate:t.rate};if(e.id)Object.assign(e,obj);else db.estimates.push({id:(db.settings.seriesEstimate||'DEV')+'-'+String(db.estimates.length+1).padStart(4,'0'),...obj});save();closeModal();render();toast('Deviz salvat.')});$('#docLines').addEventListener('input',updateDocTotal);updateDocTotal()}
function invoiceForm(i={}){let cid=i.customerId||db.customers[0]?.id||'',source=i.lines?.length?i.lines:[{description:'Manoperă',qty:1,price:0}];formModal(i.id?'Editează factură':'Factură nouă',`<div class="form-grid">${selectField('Client','customerId',db.customers.map(c=>[c.id,c.name]),cid)}<div class="field"><label>Vehicul</label><select name="carId">${carOptions(cid,i.carId)}</select></div>${field('Data emiterii','date',i.date||today(),'date')}${field('Scadență','dueDate',i.dueDate||today(),'date')}${selectField('Status','status',['Emisă','Achitată','Restantă','Anulată'].map(x=>[x,x]),i.status||'Emisă')}<div class="field full"><label>Referință / comandă</label><input name="workorderId" value="${esc(i.workorderId||'')}"></div>${linesEditor(source)}</div><div class="doc-total" id="docTotal"></div>`,d=>{let t=totals(totalLines(getLines())),obj={...d,lines:getLines(),net:t.net,vat:t.vat,gross:t.gross,vatRate:t.rate};if(i.id)Object.assign(i,obj);else{let n=db.settings.nextInvoice++;db.invoices.push({id:(db.settings.seriesInvoice||'FACT')+'-'+String(n).padStart(5,'0'),...obj})}save();closeModal();render();toast('Factură salvată ca document demonstrativ.')});$('#docLines').addEventListener('input',updateDocTotal);updateDocTotal()}
function createInvoiceFromEstimate(e){db.invoices.push({id:(db.settings.seriesInvoice||'FACT')+'-'+String(db.settings.nextInvoice++).padStart(5,'0'),customerId:e.customerId,carId:e.carId,date:today(),dueDate:today(),status:'Emisă',workorderId:e.workorderId||'',lines:structuredClone(e.lines),net:e.net,vat:e.vat,gross:e.gross,vatRate:e.vatRate,estimateId:e.id});save();render();toast('Factură demonstrativă creată din deviz.')}
function documentPrint(kind,obj){let isInv=kind==='factură',s=db.settings,t=totals(Number(obj.net)||totalLines(obj.lines||[])),rows=(obj.lines||[]).map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.description)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('');let html=`<!doctype html><html lang="ro"><head><meta charset="utf-8"><title>${kind} ${esc(obj.id)}</title><style>body{font:13px Arial,sans-serif;color:#172033;margin:36px}h1{font-size:25px;margin:0 0 6px}h2{font-size:18px}p{line-height:1.5}.muted{color:#667085}.top{display:flex;justify-content:space-between;border-bottom:2px solid #172033;padding-bottom:20px}.info{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:25px 0}table{border-collapse:collapse;width:100%;margin-top:25px}th,td{text-align:left;border-bottom:1px solid #ddd;padding:10px}th{background:#f4f6f9}.totals{margin:20px 0 0 auto;width:260px}.totals div{display:flex;justify-content:space-between;padding:6px}.grand{font-size:17px;font-weight:bold;border-top:2px solid #172033;margin-top:6px}.foot{margin-top:50px;color:#667085;font-size:10px}@media print{button{display:none}}</style></head><body><div class="top"><div><h1>${esc(s.shop||'Service Auto')}</h1><p class="muted">${esc(s.address)}<br>${esc(s.phone)} · ${esc(s.email)}<br>CUI: ${esc(s.cui||'—')} · Reg. com.: ${esc(s.reg||'—')}</p></div><div><h1>${kind.toUpperCase()}</h1><p><b>Nr.:</b> ${esc(obj.id)}<br><b>Data:</b> ${esc(obj.date)}<br>${isInv?`<b>Scadență:</b> ${esc(obj.dueDate||'—')}`:`<b>Valabil până la:</b> ${esc(obj.validUntil||'—')}`}</p></div></div><div class="info"><div><h2>Client</h2><b>${esc(customerName(obj.customerId))}</b><p>${esc(customer(obj.customerId)?.phone||'')}<br>${esc(customer(obj.customerId)?.email||'')}</p></div><div><h2>Vehicul</h2><b>${esc(carName(obj.customerId,obj.carId))}</b><p>${esc(car(obj.customerId,obj.carId)?.vin||'')}<br>Kilometraj: ${esc(car(obj.customerId,obj.carId)?.km||'—')} km</p></div></div><table><thead><tr><th>#</th><th>Descriere</th><th>Cant.</th><th>Preț unitar</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table><div class="totals"><div><span>Subtotal</span><b>${money(t.net)}</b></div><div><span>TVA (${t.rate}%)</span><b>${money(t.vat)}</b></div><div class="grand"><span>Total</span><span>${money(t.gross)}</span></div></div>${obj.notes?`<p><b>Observații:</b> ${esc(obj.notes)}</p>`:''}<p style="margin-top:35px">Semnătură client: ______________________</p><div class="foot">Document generat cu AtelierOS. ${isInv?'Această versiune demo nu transmite factura în RO e-Factura și nu înlocuiește un sistem de facturare fiscală validat.':'Deviz estimativ; lucrările se execută după acceptarea clientului.'}</div></body></html>`;let w=window.open('','_blank');if(!w){toast('Permite deschiderea ferestrelor pop-up pentru tipărire.');return}w.document.write(html);w.document.close();setTimeout(()=>w.print(),300)}
function exportCSV(){let arr=page==='customers'?db.customers:page==='appointments'?db.appointments:page==='workorders'?db.workorders:page==='estimates'?db.estimates:db.invoices;let csv=arr.map(x=>Object.values(x).map(v=>'"'+String(typeof v==='object'?JSON.stringify(v):v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('\ufeff'+csv,`atelieros-${page}-${today()}.csv`,'text/csv;charset=utf-8;')}function download(content,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}function backup(){download(JSON.stringify(db,null,2),'atelieros-backup-'+today()+'.json','application/json')}function reset(){if(confirm('Resetezi toate datele locale la setul demo? Această acțiune nu poate fi anulată.')){db=structuredClone(seed);save();searchText='';filterStatus='all';render();toast('Datele demo au fost resetate.')}}
function action(act,el){let key=el.dataset.id;switch(act){case'closeModal':closeModal();break;case'appointment':appointmentForm();break;case'editAppointment':appointmentForm(db.appointments.find(x=>x.id===key));break;case'work':workForm();break;case'editWork':workForm(db.workorders.find(x=>x.id===key));break;case'estimate':estimateForm();break;case'invoice':invoiceForm();break;case'customer':customerForm();break;case'editCustomer':customerForm(db.customers.find(x=>x.id===key));break;case'addCar':carForm(key);break;case'addLine':$('#docLines').insertAdjacentHTML('beforeend',lineHTML({description:'',qty:1,price:0},0));updateDocTotal();break;case'removeLine':if($$('#docLines .doc-line').length>1){el.closest('.doc-line').remove();updateDocTotal()}else toast('Documentul trebuie să aibă cel puțin o poziție.');break;case'toWork':{let a=db.appointments.find(x=>x.id===key);if(a){workForm({customerId:a.customerId,carId:a.carId,date:a.date,complaint:a.operation,mechanic:a.mechanic,status:'În lucru'});}break}case'printEstimate':{let e=db.estimates.find(x=>x.id===key);if(e)documentPrint('deviz',e);break}case'printInvoice':{let i=db.invoices.find(x=>x.id===key);if(i)documentPrint('factură',i);break}case'acceptEstimate':{let e=db.estimates.find(x=>x.id===key);if(e){e.status=e.status==='Acceptat'?'În așteptare':'Acceptat';save();render();toast('Status deviz actualizat.')}break}case'invoiceFromEstimate':{let e=db.estimates.find(x=>x.id===key);if(e)createInvoiceFromEstimate(e);break}case'togglePaid':{let i=db.invoices.find(x=>x.id===key);if(i){i.status=i.status==='Achitată'?'Restantă':'Achitată';save();render();toast('Status factură actualizat.')}break}case'export':exportCSV();break;case'backup':backup();break;case'restore':$('#backupFile').click();break;case'reset':reset();break}}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page=p.dataset.page;searchText='';filterStatus='all';render();return}let b=e.target.closest('[data-action]');if(b){action(b.dataset.action,b);return}});document.addEventListener('change',e=>{if(e.target.matches('[name=customerId]')&&$('#modalForm [name=carId]'))$('#modalForm [name=carId]').innerHTML=carOptions(e.target.value)});document.addEventListener('submit',e=>{if(e.target.id==='settingsForm'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());Object.assign(db.settings,d);save();render();toast('Datele service-ului au fost salvate.')}if(e.target.id==='taxForm'){e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());d.vat=Number(d.vat);d.vatRegistered=d.vatRegistered==='true';Object.assign(db.settings,d);save();render();toast('Setările fiscale au fost salvate.')}});$('#backupFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let parsed=JSON.parse(await f.text());if(!parsed.settings||!parsed.customers||!parsed.invoices)throw Error('invalid');if(confirm('Importul va înlocui datele locale actuale. Continui?')){db=parsed;save();render();toast('Backup importat.')}}catch(err){toast('Fișier backup invalid.')}e.target.value=''});
// Keep the settings and tax forms wired after each render.
const originalRender=render;render=function(){originalRender();let sf=$('#settingsForm');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(sf).entries());Object.assign(db.settings,d);save();render();toast('Datele service-ului au fost salvate.')});let tf=$('#taxForm');if(tf)tf.addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(tf).entries());d.vat=Number(d.vat);d.vatRegistered=d.vatRegistered==='true';Object.assign(db.settings,d);save();render();toast('Setările au fost salvate.')})};render();
})();
</script></body></html>
